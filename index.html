<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بذرة | منصة الروضة</title>
<meta name="description" content="بذرة: منصة تفاعلية لأطفال الروضة في الأشكال والألوان والأعداد والخطوط.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap">
<style>
/* عالم واحد مشرق للأطفال (تصميم بسمة واحدة مقصودة): سماء فاتحة، ألوان أساسية مشبعة، أزرار كبيرة، نشاط واحد في كل شاشة */
:root{
  --sky:#E9F5FF; --sky2:#D6ECFF; --paper:#FFFFFF; --ink:#2A2350; --ink2:#5B5680;
  --red:#F25C68; --orange:#FF9F45; --yellow:#FFCF4A; --green:#36C285; --blue:#4A90EE; --purple:#9C6BE0;
  --line:#CFE3F7; --shadow:rgba(42,35,80,.16);
  --font:"Rubik","Tajawal","Segoe UI","Noto Sans Arabic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,205,60,.35) 0 9px,transparent 10px),radial-gradient(circle at 88% 30%,rgba(58,141,255,.22) 0 7px,transparent 8px),radial-gradient(circle at 70% 85%,rgba(255,79,94,.22) 0 8px,transparent 9px),radial-gradient(circle at 25% 75%,rgba(46,194,126,.25) 0 7px,transparent 8px);
  background-size:520px 520px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--blue);outline-offset:3px;border-radius:18px}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* الشريط العلوي */
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.round{width:58px;height:58px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 5px 0 var(--line),0 8px 18px var(--shadow);flex:none;transition:transform .12s}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.round svg{width:30px;height:30px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand b{font-size:clamp(20px,3.2vw,30px);font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:46px;height:46px;flex:none}
.stars{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 10px;font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--line)}
.stars svg{width:28px;height:28px}

.stage{flex:1;min-height:0;position:relative;overflow:auto;padding-block:6px 16px}

/* الرئيسية */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.home h1{margin:0;font-size:clamp(30px,5.5vw,56px);font-weight:800;line-height:1.15;text-wrap:balance}
.home p{margin:0;font-size:clamp(18px,2.6vw,24px);color:var(--ink2);font-weight:600}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,3vw,34px);width:min(920px,100%)}
.door{border-radius:36px;padding:22px 16px 20px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 10px 0 rgba(0,0,0,.12),0 18px 30px var(--shadow);transition:transform .15s;position:relative;overflow:hidden}
.door:active{transform:translateY(6px) scale(.99)}
.door.shapes{background:linear-gradient(160deg,#5AA2FF,#3A6FE0)}
.door.colors{background:linear-gradient(160deg,#FF7A88,#F2486A)}
.door .art{width:min(220px,80%);aspect-ratio:1;max-width:100%}
.door b{font-size:clamp(28px,4.6vw,46px);font-weight:800;line-height:1}
.door small{font-size:clamp(15px,2vw,19px);font-weight:600;opacity:.95}
.door .got{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 12px;font-weight:800;font-size:18px}

/* مسار الأنشطة */
.path{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:4px}
.path h2{margin:0;font-size:clamp(28px,4.4vw,42px);font-weight:800;text-align:center}
.stops{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:clamp(12px,2.4vw,26px);width:min(960px,100%)}
.stop{background:var(--paper);border-radius:30px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 var(--line),0 12px 22px var(--shadow);position:relative;transition:transform .12s}
.stop:active{transform:translateY(4px)}
.stop .n{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.stop .ic{width:clamp(70px,11vw,110px);aspect-ratio:1;max-width:100%}
.stop b{font-size:clamp(20px,2.8vw,28px);font-weight:800}
.stop .done{position:absolute;top:8px;left:10px;width:38px;height:38px}
.stop.next{animation:bob 1.6s ease-in-out infinite}
.stop.next::after{content:"";position:absolute;inset:-6px;border-radius:34px;border:4px dashed var(--yellow)}
@keyframes bob{50%{transform:translateY(-6px)}}

/* شاشة النشاط */
.act{min-height:100%;display:flex;flex-direction:column;gap:12px}
.ask{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:26px;padding:10px 14px;box-shadow:0 6px 0 var(--line)}
.ask .say{width:62px;height:62px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #E3AE1C}
.ask .say svg{width:34px;height:34px}
.ask .say.talking{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.ask p{margin:0;font-size:clamp(20px,3vw,30px);font-weight:700;line-height:1.35;min-width:0;flex:1}
.dots{display:flex;gap:7px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.dots i.cur{background:var(--orange);transform:scale(1.25)}
.board{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}

/* البطاقات الكبيرة */
.grid{display:grid;gap:clamp(12px,2.2vw,24px);width:min(980px,100%)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.backpill{display:inline-flex;align-items:center;gap:6px;height:58px;padding:0 20px 0 16px;border-radius:999px;background:var(--orange);color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 0 #D97A1E,0 8px 18px var(--shadow);flex:none}
.backpill svg{width:26px;height:26px}
.backpill:active{transform:translateY(3px);box-shadow:0 2px 0 #D97A1E}
.qrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:20px}
.tok{width:clamp(54px,8.5vw,92px);aspect-ratio:1;background:var(--paper);border-radius:20px;box-shadow:0 5px 0 var(--line);display:grid;place-items:center}
.tok svg{width:80%;height:80%}
.tok.q{border:4px dashed var(--orange);font-size:clamp(28px,4vw,44px);font-weight:800;color:var(--orange);box-shadow:none}
.bigpic{background:var(--paper);border-radius:28px;box-shadow:0 7px 0 var(--line);width:min(220px,55%);aspect-ratio:1;display:grid;place-items:center}
.bigpic svg{width:85%;height:85%}
.scene{width:min(900px,100%);background:var(--paper);border-radius:30px;box-shadow:0 7px 0 var(--line);padding:10px}
.scene svg{width:100%;height:auto;display:block}
.scene .obj{cursor:pointer}
.scene .obj.found{filter:drop-shadow(0 0 6px #2EC27E)}
.count{font-size:clamp(20px,2.8vw,28px);font-weight:800;background:var(--paper);border-radius:999px;padding:4px 18px;box-shadow:0 5px 0 var(--line)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(700px,100%)}
.slot{border:4px dashed var(--line);border-radius:24px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.55);font-weight:800;font-size:clamp(16px,2.2vw,22px);color:var(--ink2);max-width:100%}
.slot svg{width:70%;height:70%}
.slot.full{border-style:solid;border-color:#A7E8C7;background:var(--paper)}
.card{background:var(--paper);border-radius:28px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 var(--line),0 12px 22px var(--shadow);transition:transform .12s;position:relative}
.card:active{transform:translateY(4px)}
.card .pic{width:100%;max-width:170px;aspect-ratio:1}
.card b{font-size:clamp(20px,2.8vw,30px);font-weight:800}
.card .tick{position:absolute;top:8px;left:8px;width:34px;height:34px}
.card.seen{box-shadow:0 7px 0 #A7E8C7,0 12px 22px var(--shadow)}
.card.good{animation:pop .5s}
.card.bad{animation:shake .45s}
@keyframes pop{40%{transform:scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.reveal{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:26px;padding:12px 18px;box-shadow:0 6px 0 var(--line);width:min(980px,100%);min-height:110px}
.reveal .objs{display:flex;gap:10px;flex:none}
.reveal .objs svg{width:clamp(56px,8vw,84px);height:auto;aspect-ratio:1}
.reveal p{margin:0;font-size:clamp(18px,2.5vw,26px);font-weight:700;line-height:1.4;min-width:0}
.col{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}

/* وصّل */
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(60px,14vw,220px);width:min(820px,100%)}
.match .side{display:flex;flex-direction:column;gap:14px}
.mi{background:var(--paper);border-radius:24px;height:clamp(78px,12vh,118px);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--line);touch-action:none;position:relative;z-index:2}
.mi svg{height:82%;width:auto;aspect-ratio:1}
.mi.sel{outline:5px solid var(--orange)}
.mi.ok{box-shadow:0 6px 0 #A7E8C7}
.mi .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.side.a .mi .dot{left:-11px}
.side.b .mi .dot{right:-11px}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}

/* صنّف */
.sort{display:flex;flex-direction:column;gap:18px;width:min(980px,100%);align-items:center}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;min-height:110px;background:rgba(255,255,255,.6);border-radius:28px;padding:12px;width:100%;border:3px dashed var(--line)}
.item{width:clamp(70px,10vw,96px);aspect-ratio:1;background:var(--paper);border-radius:22px;display:grid;place-items:center;box-shadow:0 5px 0 var(--line);touch-action:none;user-select:none}
.item svg{width:80%;height:80%;pointer-events:none}
.item.sel{outline:5px solid var(--orange)}
.item.drag{position:fixed;z-index:50;pointer-events:none;box-shadow:0 16px 30px var(--shadow);transform:scale(1.08)}
.bins{display:grid;gap:14px;width:100%}
.bin{border-radius:28px;min-height:150px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;border:5px solid;background:var(--paper)}
.bin .lbl{width:64px;height:64px}
.bin .in{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.bin .in svg{width:40px;height:40px}
.bin.hot{transform:scale(1.03)}

/* التلوين والرسم */
.paint{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;width:min(1000px,100%);align-items:center}
.canvasbox{background:var(--paper);border-radius:30px;box-shadow:0 7px 0 var(--line);padding:10px;display:flex;justify-content:center;min-width:0}
.canvasbox svg,.canvasbox canvas{width:100%;max-width:640px;height:auto;display:block;touch-action:none}
.palette{display:flex;flex-direction:column;gap:12px}
.pc{width:64px;height:64px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.15);border:5px solid #fff}
.pc.on{outline:5px solid var(--ink);outline-offset:2px}
.tools{display:flex;gap:10px;justify-content:center}
.btn{background:var(--paper);border-radius:999px;padding:10px 22px;font-size:22px;font-weight:800;box-shadow:0 5px 0 var(--line);display:inline-flex;align-items:center;gap:8px}
.btn svg{width:26px;height:26px}
.btn.go{background:var(--green);color:#fff;box-shadow:0 6px 0 #1E9A62;font-size:26px;padding:12px 30px}
.region{cursor:pointer;transition:fill .2s}
.hint{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{stroke-width:10;stroke:#FF9A3C}}

/* امزج */
.mix{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;width:min(940px,100%)}
.pots{display:flex;flex-direction:column;gap:14px}
.pot{width:clamp(80px,11vw,110px);aspect-ratio:1;border-radius:28px;background:var(--paper);box-shadow:0 6px 0 var(--line);display:grid;place-items:center}
.pot svg{width:80%;height:80%}
.bowlwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.bowlwrap svg{width:min(340px,100%);height:auto}
.target{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--line)}
.target b{font-size:22px}
.target svg{width:90px;height:90px}

/* نافذة الإنجاز */
.over{position:fixed;inset:0;background:rgba(42,35,80,.45);display:grid;place-items:center;z-index:80;padding:16px}
.win{background:var(--paper);border-radius:36px;padding:22px 22px 24px;width:min(560px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:rise .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:.4}}
.win .big{width:120px;height:120px}
.win h3{margin:0;font-size:clamp(28px,4vw,38px);font-weight:800}
.win .fact{margin:0;font-size:clamp(19px,2.6vw,24px);font-weight:600;line-height:1.45;color:var(--ink2)}
.win .value{background:#FFF6D9;border-radius:22px;padding:10px 14px;font-size:clamp(18px,2.5vw,23px);font-weight:700;line-height:1.45;width:100%}
.win .value span{display:block;font-size:16px;color:#B07A00;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}


/* الدرس المصوّر */
.lessonbtn{display:flex;align-items:center;gap:14px;width:min(960px,100%);border-radius:30px;padding:14px 20px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.14),0 14px 26px var(--shadow);text-align:start}
.lessonbtn .play{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.lessonbtn .play svg{width:30px;height:30px}
.lessonbtn b{font-size:clamp(22px,3vw,30px);font-weight:800;display:block}
.lessonbtn small{font-size:clamp(15px,2vw,19px);font-weight:600;opacity:.95}
.lesson{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.screen{width:min(980px,100%);aspect-ratio:16/9;max-width:100%;background:#F3F9FF;border-radius:28px;overflow:hidden;box-shadow:0 8px 0 var(--line),0 14px 30px var(--shadow);position:relative}
.screen svg{width:100%;height:100%;display:block}
.cap{width:min(980px,100%);background:var(--paper);border-radius:22px;padding:10px 16px;font-size:clamp(19px,2.6vw,27px);font-weight:700;line-height:1.45;box-shadow:0 5px 0 var(--line);min-height:2.9em}
.ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctrl .round{width:64px;height:64px}
.ctrl .round.main{width:78px;height:78px;background:var(--green)}
.sdots{display:flex;gap:7px}
.sdots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.sdots i.on{background:var(--orange)}
.vnote{width:min(980px,100%);background:#FFF6D9;border-radius:18px;padding:8px 14px;font-size:16px;font-weight:600;color:#7A5A00}
.screen .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:ldraw 1.8s ease forwards}
.screen .pop{transform-box:fill-box;transform-origin:center;animation:lpop .6s cubic-bezier(.2,1.5,.4,1) backwards}
.screen .fadein{animation:lfade .8s ease backwards}
.screen .bob{transform-box:fill-box;transform-origin:center;animation:lbob 1.6s ease-in-out infinite}
.screen .fall{animation:lfall 1s ease-in backwards}
.screen .fillto{animation:lfill 1s ease forwards}
@keyframes ldraw{to{stroke-dashoffset:0}}
@keyframes lpop{from{transform:scale(0);opacity:0}}
@keyframes lfade{from{opacity:0}}
@keyframes lbob{50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes lfall{from{transform:translateY(-160px);opacity:0}70%{opacity:1}}
@keyframes lfill{from{fill:#F2F2F7}to{fill:var(--to)}}
@keyframes ballpos{0%,28%{transform:translate(0,0)}33%,61%{transform:translate(0,120px)}66%,95%{transform:translate(-190px,120px)}100%{transform:translate(0,0)}}
.screen .ballmove{animation:ballpos 9s ease-in-out forwards}

/* ===== مظهر ثلاثي الأبعاد ===== */
.round,.stars,.btn{box-shadow:inset 0 -5px 0 rgba(42,35,80,.10),inset 0 4px 0 rgba(255,255,255,.9),0 6px 0 var(--line),0 10px 18px var(--shadow)}
.door{box-shadow:inset 0 -10px 0 rgba(0,0,0,.16),inset 0 6px 0 rgba(255,255,255,.28),0 12px 0 rgba(0,0,0,.14),0 22px 34px var(--shadow);transform:perspective(900px) rotateX(5deg);transition:transform .2s}
.door:hover{transform:perspective(900px) rotateX(0) translateY(-4px)}
.door:active{transform:perspective(900px) rotateX(0) translateY(6px)}
.stop{box-shadow:inset 0 -7px 0 rgba(42,35,80,.07),inset 0 5px 0 #fff,0 8px 0 var(--line),0 14px 24px var(--shadow);background:linear-gradient(180deg,#fff,#F4F9FF)}
.stop .n{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}
.lessonbtn{box-shadow:inset 0 -8px 0 rgba(0,0,0,.16),inset 0 5px 0 rgba(255,255,255,.3),0 9px 0 rgba(0,0,0,.14),0 16px 28px var(--shadow)}
.tok{filter:drop-shadow(0 6px 6px rgba(42,35,80,.18))}
.ask .say{display:none!important}
.cube3d{width:86px;height:86px;perspective:600px;margin-bottom:-6px}
.cube3d .c{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin3d 9s linear infinite}
.cube3d i{position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.cube3d i:nth-child(1){background:linear-gradient(135deg,#FF8A95,#FF4F5E);transform:translateZ(43px)}
.cube3d i:nth-child(2){background:linear-gradient(135deg,#7DB6FF,#3A8DFF);transform:rotateY(180deg) translateZ(43px)}
.cube3d i:nth-child(3){background:linear-gradient(135deg,#FFE07A,#FFCD3C);transform:rotateY(90deg) translateZ(43px)}
.cube3d i:nth-child(4){background:linear-gradient(135deg,#6EE0A8,#2EC27E);transform:rotateY(-90deg) translateZ(43px)}
.cube3d i:nth-child(5){background:linear-gradient(135deg,#C29BF2,#9B5DE5);transform:rotateX(90deg) translateZ(43px)}
.cube3d i:nth-child(6){background:linear-gradient(135deg,#FFBE7D,#FF9A3C);transform:rotateX(-90deg) translateZ(43px)}
@keyframes spin3d{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}

/* ===== الأطفال والإنجاز ===== */
.kidbtn{width:58px;height:58px;padding:0;overflow:hidden}
.kidbtn svg{width:100%;height:100%}
.av{display:block;width:100%;height:100%}
.me{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:999px;padding:6px 18px 6px 8px;box-shadow:inset 0 -5px 0 rgba(42,35,80,.08),0 6px 0 var(--line)}
.me .av{width:52px;height:52px}
.me b{font-size:22px;font-weight:800}

let hintFn=null,idleT=null,lastAsk='';
const HINTS=['دعني أساعدك، انظر إلى ما يلمع!','أنا معك، جرّب هذا!','هيا نحاول معًا، انظر هنا!'];

function dragPick(itemEls,targets,onDrop){
  let sel=null;
  itemEls.forEach(it=>{
    it.addEventListener('pointerdown',e=>{
      if(it.dataset.used)return;e.preventDefault();sfx.pop();
      const r=it.getBoundingClientRect();const ghost=it.cloneNode(true);ghost.classList.add('drag');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';
      const ox=e.clientX-r.left,oy=e.clientY-r.top;let moved=false;const sx=e.clientX,sy=e.clientY;
      const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;document.body.appendChild(ghost);it.style.opacity=.3}
        if(moved){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';targets.forEach(t=>t.classList.toggle('hot',hit(t,ev)))}};
      const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);ghost.remove();it.style.opacity='';targets.forEach(t=>t.classList.remove('hot'));
        if(moved){const t=targets.find(t=>hit(t,ev));if(t)onDrop(it,t)}
        else{itemEls.forEach(x=>x.classList.remove('sel'));if(sel===it){sel=null}else{sel=it;it.classList.add('sel')}}};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
    });
  });
  targets.forEach(t=>t.addEventListener('click',()=>{if(sel){const it=sel;sel=null;it.classList.remove('sel');onDrop(it,t)}}));
  const hit=(t,ev)=>{const r=t.getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom};
}

    <g class="region" data-r="dates" data-k="red" fill="#fff" stroke="#2A2350" stroke-width="2.5">${[[164,134],[176,136],[188,134],[170,146],[182,146]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="6" ry="8"/>`).join('')}</g>
    ${dot(24,24,'blue')}${dot(330,62,'yellow')}${dot(30,198,'blue')}${dot(40,262,'yellow')}${dot(162,240,'brown')}${dot(110,118,'green')}${dot(176,160,'red')}
  </svg>`;
  const el=h(`<div class="paint"><div class="canvasbox">${svg}</div><div class="palette"></div></div>`);board.appendChild(el);
  let cur=null,n=0;const pal=el.querySelector('.palette');
  ['blue','yellow','green','brown','red','orange'].forEach(k=>{const b=h(`<button class="pc" data-k="${k}" style="background:${C[k]}" aria-label="${CN[k]}"></button>`);b.onclick=()=>{cur=k;pal.querySelectorAll('.pc').forEach(x=>x.classList.remove('on'));b.classList.add('on');sfx.tap();say(CN[k])};pal.appendChild(b)});
  hint(()=>{const r=el.querySelector('.region:not([data-ok])');return r?pal.querySelector(`[data-k="${r.dataset.k}"]`):null});
  ask('لوّن صورة بلادي: النخلة والبحر والرمل. انظر إلى النقطة واختر لونها');
  el.querySelectorAll('.region').forEach(r=>r.addEventListener('click',()=>{if(r.dataset.ok)return;if(!cur){say('اختر لونًا أولًا');return}
    if(cur===r.dataset.k){r.setAttribute('fill',C[cur]);r.dataset.ok=1;sfx.splash();say(CN[cur]);if(++n===regions.length){ask('ما أجمل بلادي!');setTimeout(finish,1500)}}
    else{sfx.bad();say('انظر إلى النقطة. هذا الجزء لونه '+CN[r.dataset.k])}}));
},
rainbow({board,ask,finish,hint}){
  const bands=['red','orange','yellow','green','blue','purple'];
  const svg=`<svg viewBox="0 0 400 230"><rect x="0" y="0" width="400" height="230" fill="#E9F5FF"/>${bands.map((k,i)=>{const r=180-i*24;return `<path class="region" data-k="${k}" d="M${200-r} 210a${r} ${r} 0 0 1 ${2*r} 0h-24a${r-24} ${r-24} 0 0 0 -${2*r-48} 0z" fill="#fff" stroke="#2A2350" stroke-width="3"/><circle cx="${200-r+12}" cy="200" r="9" fill="${C[k]}" stroke="#fff" stroke-width="2" pointer-events="none"/><circle cx="${200+r-12}" cy="200" r="9" fill="${C[k]}" stroke="#fff" stroke-width="2" pointer-events="none"/>`}).join('')}</svg>`;
  const el=h(`<div class="paint"><div class="canvasbox">${svg}</div><div class="palette"></div></div>`);board.appendChild(el);
  let cur=null;const pal=el.querySelector('.palette');let n=0;
  Object.entries(C).forEach(([k,c])=>{const b=h(`<button class="pc" style="background:${c}" aria-label="${CN[k]}"></button>`);b.dataset.k=k;b.onclick=()=>{cur=k;pal.querySelectorAll('.pc').forEach(x=>x.classList.remove('on'));b.classList.add('on');sfx.tap();say(CN[k])};pal.appendChild(b)});
  hint(()=>{const r=el.querySelector('.region:not([data-ok])');return r?pal.querySelector(`[data-k="${r.dataset.k}"]`):null});
  ask('لوّن قوس المطر: انظر إلى النقطة في كل قوس واختر لونها');
  el.querySelectorAll('.region').forEach(r=>r.addEventListener('click',()=>{if(r.dataset.ok)return;if(!cur){say('اختر لونًا أولًا');return}
    if(cur===r.dataset.k){r.setAttribute('fill',C[cur]);r.dataset.ok=1;sfx.splash();say(CN[cur]);if(++n===bands.length){ask('ما أجمل قوس المطر!');setTimeout(finish,1400)}}
    else{sfx.bad();say('انظر إلى النقطة. هذا القوس '+CN[r.dataset.k])}}));
},
cdraw({board,ask,finish}){
  const el=h(`<div class="paint"><div class="canvasbox"><canvas width="800" height="520"></canvas></div><div class="palette"></div></div>`);board.appendChild(el);
  const tools=h(`<div class="tools" style="margin-top:10px"><button class="btn" id="clr2">امسح</button><button class="btn go" id="fin">انتهيت</button></div>`);board.parentElement.appendChild(tools);
  const cv=el.querySelector('canvas'),x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,800,520);let cur=C.yellow,drawing=false,last=null;let ink=0;
  const pal=el.querySelector('.palette');
  Object.entries(C).forEach(([k,c])=>{const b=h(`<button class="pc ${c===cur?'on':''}" style="background:${c}" aria-label="${CN[k]}"></button>`);b.onclick=()=>{cur=c;pal.querySelectorAll('.pc').forEach(q=>q.classList.remove('on'));b.classList.add('on');sfx.tap();say(CN[k])};pal.appendChild(b)});
  ask('ارسم شمسًا صفراء وشجرة خضراء، ولوّن ما تحب');
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*520/r.height]};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);x.fillStyle=cur;x.beginPath();x.arc(...last,11,0,7);x.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);x.strokeStyle=cur;x.lineWidth=22;x.lineCap='round';x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();ink+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p});
  const end=()=>drawing=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  tools.querySelector('#clr2').onclick=()=>{sfx.tap();x.fillStyle='#fff';x.fillRect(0,0,800,520);ink=0};
  tools.querySelector('#fin').onclick=()=>{if(ink<300){say('ارسم قليلًا ثم اضغط انتهيت');return}finish()};
}
};
